name: Restore complete v0.1.12 snapshot

on:
  push:
    paths:
      - '.recovery/RESTORE'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and validate archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .recovery/part00.b64 \
            .recovery/part01.b64 \
            .recovery/part02.b64 \
            .recovery/part03.b64 \
            .recovery/part04.b64 \
            .recovery/part05.b64 \
            .recovery/part06.b64 \
            .recovery/part07a.b64 \
            .recovery/part07b.b64 \
            .recovery/part07c.b64 \
            .recovery/part07d.b64 \
            .recovery/part08.b64 | base64 --decode > /tmp/cortex64-128-v0.1.12.tar.xz
          xz --test /tmp/cortex64-128-v0.1.12.tar.xz
          tar -tJf /tmp/cortex64-128-v0.1.12.tar.xz >/dev/null
          mkdir -p /tmp/cortex-snapshot
          tar -xJf /tmp/cortex64-128-v0.1.12.tar.xz -C /tmp/cortex-snapshot
          test -f /tmp/cortex-snapshot/Cortex64-128-v0.1.12/rtl/cpu/cortex_core.sv
          test -f /tmp/cortex-snapshot/Cortex64-128-v0.1.12/tools/gen_smoke_hex.py
          echo "Snapshot archive validated."

      - name: Restore source files and remove transfer data
        shell: bash
        run: |
          set -euo pipefail
          src=/tmp/cortex-snapshot/Cortex64-128-v0.1.12
          cp -a "$src"/. "$GITHUB_WORKSPACE"/
          rm -rf "$GITHUB_WORKSPACE/.recovery"
          test -f rtl/cpu/cortex_core.sv
          echo "Restored $(find . -type f -not -path './.git/*' | wc -l) project files."

      - name: Commit complete project snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Restore complete Cortex64/128 v0.1.12 source snapshot"
            git push origin HEAD:main
          fi
