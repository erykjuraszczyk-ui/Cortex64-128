name: RTL Protocol Assertions, Lint and Regression Test
on: [push, pull_request]
jobs:
  rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y verilator python3-pytest
      - name: Report simulator version
        run: verilator --version
      - name: Lint
        run: ./tools/lint.sh
      - name: Test
        run: ./tools/test.sh
